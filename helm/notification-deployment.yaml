apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: reganputra/e-wallet-notification-service:1.0
          ports:
            - containerPort: 8083 # HTTP
            - containerPort: 7005 # gRPC
          env:
            - name: APP_NAME
              value: "e-wallet-notification-service"
            - name: PORT
              value: "8083"
            - name: GRPC_PORT
              value: "7005"
            - name: DB_HOST
              value: "notification-mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "notification-service-db"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "rootpassword"
            - name: SMTP_HOST
              value: "smtp.gmail.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_AUTH_EMAIL
              value: "ramadhanregan334@gmail.com"
            - name: SMTP_AUTH_PASSWORD
              value: "imjz kmvd ueyu omdx"
