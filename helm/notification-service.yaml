apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  type: NodePort
  ports:
    - protocol: TCP
      name: http
      port: 8083
      targetPort: 8083
      nodePort: 30007
    - protocol: TCP
      name: grpc
      port: 7005
      targetPort: 7005
      nodePort: 30008
