apiVersion: apps/v1
kind: Deployment
metadata:
  name: ums
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ums
  template:
    metadata:
      labels:
        app: ums
    spec:
      containers:
        - name: ums
          image: reganputra/e-wallet-ums:1.1
          ports:
            - containerPort: 8080 # HTTP
            - containerPort: 7000 # gRPC
          env:
            - name: APP_NAME
              value: "ewallet-ums"
            - name: APP_SECRET
              value: "myscrttt"
            - name: PORT
              value: "8080"
            - name: GRPC_PORT
              value: "7000"
            - name: DB_HOST
              value: "ums-mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "ums-service-db"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "rootpassword"
            - name: WALLET_HOST
              value: "http://wallet-service:8081"
            - name: WALLET_ENDPOINT_CREATE
              value: "/wallet/v1"
            - name: NOTIFICATION_GRPC_HOST
              value: "notification-service:7005"
