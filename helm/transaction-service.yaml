apiVersion: v1
kind: Service
metadata:
  name: transaction-service
spec:
  selector:
    app: transaction-service
  type: NodePort
  ports:
    - protocol: TCP
      name: http
      port: 8082
      targetPort: 8082
      nodePort: 30005
    - protocol: TCP
      name: grpc
      port: 7004
      targetPort: 7004
      nodePort: 30006
