apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
        - name: transaction-service
          image: reganputra/e-wallet-transaction-service:1.0
          ports:
            - containerPort: 8082 # HTTP
            - containerPort: 7004 # gRPC
          env:
            - name: APP_NAME
              value: "ewallet-transaction-service"
            - name: PORT
              value: "8082"
            - name: GRPC_PORT
              value: "7004"
            - name: DB_HOST
              value: "transaction-mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "transaction-service-db"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "rootpassword"
            - name: UMS_GRPC_HOST
              value: "ums:7000"
            - name: WALLET_HOST
              value: "http://wallet-service:8081/"
            - name: WALLET_ENDPOINT_DEBIT
              value: "wallet/v1/balance/debit"
            - name: WALLET_ENDPOINT_CREDIT
              value: "wallet/v1/balance/credit"
            - name: NOTIFICATION_GRPC_HOST
              value: "notification-service:7005"
